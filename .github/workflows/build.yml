name: Build Patched Telegram Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/Telegram-Android
          path: Telegram-Android
          fetch-depth: 0

      - name: Checkout tproxy patches
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tproxy-server
          path: tproxy-server
          sparse-checkout: |
            ANDROID.md
            android/
          sparse-checkout-cone-mode: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply tproxy patches
        run: |
          cd Telegram-Android
          # Apply the patches from tproxy-server/android/ directory
          for patch in ../tproxy-server/android/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              git am "$patch" || echo "Patch $patch failed, trying to continue..."
            fi
          done

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd Telegram-Android
          ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-tproxy.apk
          path: Telegram-Android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk