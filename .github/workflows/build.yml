name: Build Telegram Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tproxy-server (docs/reference)
        uses: actions/checkout@v5
        with:
          repository: telegramdesktop/tproxy-server
          path: tproxy-server

      - name: Checkout Telegram Android
        uses: actions/checkout@v5
        with:
          repository: DrKLO/Telegram
          path: Telegram-Android
          submodules: recursive     # обязательно: три сабмодуля
          # fetch-depth не ставим в 1 — git am и сабмодули этого не любят
          # token не передаём — репо публичный

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2.4988404"

      - name: Build APK
        working-directory: Telegram-Android
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: Telegram-Android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
