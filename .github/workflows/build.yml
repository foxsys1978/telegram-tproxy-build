name: Build Patched Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout tproxy patches
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tproxy-server
          path: tproxy-server

      - name: Clone Telegram Android (with auth)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/telegramdesktop/Telegram-Android.git Telegram-Android

      - name: Apply tproxy patches
        run: |
          cd Telegram-Android
          ls -la ../tproxy-server/android/ || echo "No patches dir"
          for patch in ../tproxy-server/android/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              git am "$patch" || echo "Patch apply failed, continuing..."
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd Telegram-Android
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-tproxy.apk
          path: Telegram-Android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk